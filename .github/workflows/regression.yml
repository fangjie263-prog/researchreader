name: EPUB regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run fixed EPUB regression
        shell: bash
        run: |
          sample="books/the-wall-street-journal 01-08-2026 (Kobo).epub"
          if [[ -f "$sample" ]]; then
            python regression_validation.py "$sample" --output output/validation.json
          else
            echo "Fixed EPUB sample not provisioned; unit regression checks completed."
          fi
